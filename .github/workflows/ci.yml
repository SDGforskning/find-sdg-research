name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run types:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  a11y:
    name: a11y
    # Heavy production build. Content-only pushes from other accounts skip it,
    # matching the GitLab jobs in sok-og-skriv-web and phd-on-track-web.
    if: github.actor == 'tarjelavik'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      PLAYWRIGHT_PORT: "3005"
      # Placeholders so the production build can start. The suite scans pages
      # and does not need a live Elasticsearch cluster. Real values stay on Vercel.
      ES_HOST: "http://127.0.0.1:9"
      ES_APIKEY: "ci-a11y-placeholder"
      SITE_URL: "http://127.0.0.1:3005"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  security-audit:
    name: security:audit
    if: github.actor == 'tarjelavik'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
